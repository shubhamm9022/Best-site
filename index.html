<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MoviesVault - Stream and download the latest movies and TV series in HD, FHD, and 4K quality. Regular updates with new releases.">
  <meta name="keywords" content="movies, TV series, streaming, downloads, HD, FHD, 4K, bollywood, hollywood, webseries">
  <meta name="robots" content="index, follow">
  <meta name="googlebot" content="index, follow">
  <meta property="og:title" content="MoviesVault - Latest Movies & TV Series">
  <meta property="og:description" content="Stream and download the latest movies and TV series in HD quality.">

  <meta property="og:image" content="https://moviesvault.example.com/images/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://moviesvault.example.com">
  <title>MoviesVault - Latest Movies & TV Series | HD Streaming & Downloads</title>
  
  <!-- Structured Data for SEO -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MoviesVault",
      "url": "https://moviesvault.example.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://moviesvault.example.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>
  
  <!-- Poppins Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* RESET & BASE STYLES */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0d0d0d; 
      font-family: 'Poppins', sans-serif;
      color: white;
      line-height: 1.6;
    }
    
    /* HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(13, 13, 13, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 30px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    
    .logo-img { 
      height: 32px; 
      width: auto;
      transition: transform 0.3s ease;
    }
    
    .logo:hover .logo-img {
      transform: scale(1.05);
    }
    
    .logo-text {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(90deg, #ff4d4d, #f9cb28);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    nav {
      display: flex;
      align-items: center;
      gap: 30px;
    }
    
    nav a {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      padding: 8px 0;
      position: relative;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    nav a:hover {
      color: white;
    }
    
    nav a.active {
      color: white;
    }
    
    nav a.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, #ff4d4d, #f9cb28);
      border-radius: 2px;
    }
    
    .right-section {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .search-icon {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: all 0.3s ease;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    
    .search-icon:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }
    
    .search-box {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      background: rgba(20, 20, 20, 0.98);
      padding: 12px 15px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      min-width: 280px;
      z-index: 1001;
    }
    
    .search-box.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    
    .search-box input {
      width: 100%;
      padding: 10px 15px;
      background: rgba(30, 30, 30, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }
    
    .search-box input::placeholder {
      color: rgba(255, 255, 255, 0.5);
      font-weight: 400;
    }
    
    .search-box input:focus {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(40, 40, 40, 0.8);
    }
    
    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      width: 24px;
      height: 24px;
      z-index: 1002;
    }
    
    .hamburger span {
      width: 24px;
      height: 2px;
      background: white;
      border-radius: 3px;
      transition: all 0.4s;
    }
    
    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    
    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }
    
    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }
    
    /* CONTENT WRAPPER */
    .content-wrapper {
      margin-top: 72px;
      padding: 20px;
    }
    
    /* BREADCRUMB - IMPROVED FOR MOBILE */
    .breadcrumb {
      display: flex;
      padding: 12px 15px;
      background: rgba(30, 30, 30, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      margin-bottom: 15px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    
    .breadcrumb::-webkit-scrollbar {
      display: none;
    }
    
    .breadcrumb ol {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    
    .breadcrumb li {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }
    
    .breadcrumb a {
      display: inline-flex;
      align-items: center;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      transition: color 0.3s;
    }
    
    .breadcrumb a:hover {
      color: white;
    }
    
    .breadcrumb svg {
      width: 14px;
      height: 14px;
      margin-right: 8px;
      flex-shrink: 0;
    }
    
    .breadcrumb .separator {
      color: rgba(255, 255, 255, 0.4);
      margin: 0 8px;
      flex-shrink: 0;
    }
    
    .breadcrumb .current {
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
      flex-shrink: 0;
    }
    
    /* FILTER CONTROLS */
    .filter-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    .filter-btn {
      padding: 8px 16px;
      background: rgba(30, 30, 30, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
    }
    
    .filter-btn.active {
      background: linear-gradient(90deg, #ff4d4d, #f9cb28);
      border-color: transparent;
    }
    
    /* LATEST RELEASES SECTION - IMPROVED FOR MOBILE */
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 15px 0;
      padding: 10px 15px;
      background: rgba(30, 30, 30, 0.5);
      border-radius: 8px;
    }
    
    .section-title i {
      color: #f9cb28;
      font-size: 18px;
    }
    
    .section-title h2 {
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    /* MOVIE CARDS */
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      justify-items: center;
      color: white;
    }
    
    .movie-card {
      position: relative;
      width: 100%;
      max-width: 180px;
      background: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8);
      transition: transform 0.4s, box-shadow 0.4s;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    
    .movie-card:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
    }
    
    .poster-wrapper {
      position: relative;
      width: 100%;
      height: 270px;
      background: #2a2a2a;
      overflow: hidden;
    }
    
    .movie-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.5s;
      opacity: 0;
    }
    
    .movie-poster.loaded { opacity: 1; }
    
    .rating-star {
      position: absolute;
      bottom: 8px;
      left: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.7);
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      backdrop-filter: blur(4px);
    }
    
    .rating-star img { 
      width: 14px; 
      height: 14px;
      image-rendering: -webkit-optimize-contrast;
    }
    
    .movie-info {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 60px;
    }
    
    .title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3em;
      max-height: 2.6em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      text-overflow: ellipsis;
    }
    
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      font-size: 11px;
      opacity: 0.9;
    }
    
    .tag {
      padding: 2px 6px;
      border-radius: 5px;
      background: #333;
      font-size: 10px;
    }
    
    .tag.hd { background: #4CAF50; }
    .tag.cam { background: #FF5722; }
    .tag.fhd { background: #2196F3; }
    .tag._4k { background: #9C27B0; }
    .tag.tv { background: #FF9800; }
    
    /* PAGINATION */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 30px 0;
      padding: 0 20px;
      flex-wrap: wrap;
    }
    
    .page-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(30, 30, 30, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .page-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
    }
    
    .page-btn.active {
      background: linear-gradient(90deg, #ff4d4d, #f9cb28);
      border-color: transparent;
    }
    
    .page-btn.disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    
    /* LOADER */
    .loader {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 6px solid #1a1a1a;
      border-top: 6px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      z-index: 2000;
    }
    
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    
    /* RESPONSIVE */
    @media (max-width: 768px) {
      header {
        padding: 0 15px;
      }
      
      nav {
        position: fixed;
        top: 72px;
        right: 0;
        width: 250px;
        height: calc(100vh - 72px);
        background: rgba(13, 13, 13, 0.98);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        flex-direction: column;
        align-items: flex-start;
        padding: 20px;
        gap: 15px;
        transform: translateX(100%);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border-left: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 999;
        overflow-y: auto;
      }
      
      nav.active {
        transform: translateX(0);
      }
      
      .hamburger {
        display: flex;
      }
      
      .search-box {
        right: -30px;
        min-width: 260px;
      }
      
      .logo-text {
        display: none;
      }
      
      .content-wrapper {
        padding: 15px;
      }
      
      .breadcrumb {
        padding: 10px 12px;
      }
      
      .section-title {
        padding: 8px 12px;
      }
      
      .section-title i {
        font-size: 16px;
      }
      
      .section-title h2 {
        font-size: 15px;
      }
      
      .movies-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }
      
      .poster-wrapper {
        height: 240px;
      }
      
      .filter-controls {
        gap: 8px;
      }
      
      .filter-btn {
        padding: 6px 12px;
        font-size: 13px;
      }
    }

    @media (max-width: 480px) {
      .breadcrumb a, .breadcrumb .current {
        font-size: 12px;
      }
      
      .breadcrumb svg {
        width: 12px;
        height: 12px;
        margin-right: 6px;
      }
      
      .breadcrumb .separator {
        margin: 0 6px;
      }
      
      .section-title h2 {
        font-size: 14px;
      }
      
      .page-btn {
        width: 32px;
        height: 32px;
        font-size: 13px;
      }
      
      .movies-grid {
        grid-template-columns: 1fr;
      }
      
      .movie-card {
        max-width: 100%;
      }
    }
    
    /* DNS Prefetch for performance */
    .dns-prefetch {
      display: none;
    }
  </style>
  
  <!-- DNS Prefetch for critical domains -->
  <link rel="dns-prefetch" href="//api.themoviedb.org">
  <link rel="dns-prefetch" href="//image.tmdb.org">

  <!-- Preconnect for critical domains -->
  <link rel="preconnect" href="https://api.themoviedb.org" crossorigin>

  <!-- Asset protection - Hide from inspect element -->
  <script>
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
    
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 117)) { // Ctrl+U
        e.preventDefault();
      }
      if (e.keyCode === 123) { // F12
        e.preventDefault();
      }
    });
  </script>
</head>

<script>
  // Enhanced Header functionality
  const hamburger = document.getElementById('hamburger');
  const menu = document.getElementById('menu');
  const searchIcon = document.getElementById('search-icon');
  const searchBox = document.getElementById('search-box');
  const searchInput = searchBox.querySelector('input');
  const navLinks = document.querySelectorAll('nav a');
  const filterBtns = document.querySelectorAll('.filter-btn');
  
  // Toggle mobile menu
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('active');
    menu.classList.toggle('active');
    
    // Close search box if open
    if (searchBox.classList.contains('active')) {
      searchBox.classList.remove('active');
    }
  });
  
  // Toggle search box
  searchIcon.addEventListener('click', (e) => {
    e.stopPropagation();
    searchBox.classList.toggle('active');
    if (searchBox.classList.contains('active')) {
      searchInput.focus();
    }
    
    // Close mobile menu if open
    if (menu.classList.contains('active')) {
      menu.classList.remove('active');
      hamburger.classList.remove('active');
    }
  });
  
  // Close search box when clicking outside
  document.addEventListener('click', (e) => {
    if (!searchBox.contains(e.target) && !searchIcon.contains(e.target)) {
      searchBox.classList.remove('active');
    }
  });
  
  // Navigation and filtering
  navLinks.forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const filter = link.dataset.filter;
      
      navLinks.forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      
      // Update breadcrumb
      updateBreadcrumb(link.textContent);
      
      // Filter content
      filterMedia(filter);
      
      // Close mobile menu if open
      if (menu.classList.contains('active')) {
        menu.classList.remove('active');
        hamburger.classList.remove('active');
      }
    });
  });
  
  // Filter buttons functionality
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {

  const apiCache = new Map();

  async function fetchMedia() {
    try {
      loader.style.display = 'block';
      
      // 1. Load your custom content from JSON
      const response = await fetch('movies.json');
      const yourContent = await response.json();
      
      // 2. Fetch details for each item from TMDb with caching
      allMedia = await Promise.all(
        yourContent.movies.map(async item => {
          try {
            const cacheKey = `${item.type}_${item.id}`;
            
            // Check cache first
            if (apiCache.has(cacheKey)) {
              return apiCache.get(cacheKey);
            }
            
            const endpoint = item.type === 'tv' 
              ? `https://api.themoviedb.org/3/tv/${item.id}?api_key=${apiKey}`
              : `https://api.themoviedb.org/3/movie/${item.id}?api_key=${apiKey}`;
            
            const tmdbResponse = await fetch(endpoint);
            const tmdbData = await tmdbResponse.json();
            
            const mediaItem = {
              ...tmdbData,
              media_type: item.type || 'movie',
              stream_link: item.stream_link,
              download_links: item.download_links || {},
              added_date: item.added_date || new Date().toISOString()
            };
            
            // Add to cache
            apiCache.set(cacheKey, mediaItem);
            
            return mediaItem;
          } catch (error) {
            console.error(`Error fetching ${item.type} ${item.id}:`, error);
            return null;
          }
        })
      );
      
      // Filter out failed fetches
      allMedia = allMedia.filter(item => item !== null);
      
      // Sort by popularity (or release date) by default
      allMedia.sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
      
      filteredMedia = [...allMedia];
      totalPages = Math.ceil(filteredMedia.length / moviesPerPage);
      displayMedia();
      setupPagination();
      
      // Update meta description with content count
      updateMetaDescription();
    } catch (error) {
      console.error('Error loading content:', error);
      moviesContainer.innerHTML = '<p style="color: white; grid-column: 1/-1; text-align: center;">Failed to load content. Please try again later.</p>';
    } finally {
      loader.style.display = 'none';
    }
  }

  function filterMedia(filter) {
    currentFilter = filter;
    currentPage = 1;
    
    switch(filter) {
      case 'all':
        filteredMedia = [...allMedia];
        break;
      case 'movie':
        filteredMedia = allMedia.filter(media => media.media_type === 'movie');
        break;
      case 'tv':
        filteredMedia = allMedia.filter(media => media.media_type === 'tv');
        break;
      case 'hd':
        filteredMedia = allMedia.filter(media => media.download_links && 'HD' in media.download_links);
        break;
      case 'fhd':
        filteredMedia = allMedia.filter(media => media.download_links && 'FHD' in media.download_links);
        break;
      case '4k':
        filteredMedia = allMedia.filter(media => media.download_links && '4K' in media.download_links);
        break;
      case 'latest':
        filteredMedia = [...allMedia].sort((a, b) => 
          new Date(b.release_date || b.first_air_date || b.added_date) - 
          new Date(a.release_date || a.first_air_date || a.added_date)
        );
        break;
      case 'popular':
        filteredMedia = [...allMedia].sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
        break;
      default:
        filteredMedia = [...allMedia];
    }
    
    totalPages = Math.ceil(filteredMedia.length / moviesPerPage);
    displayMedia();
    setupPagination();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    
    // Update meta description with filtered content count
    updateMetaDescription();
  }

    document.querySelector('meta[name="description"]').setAttribute('content', description);
  }
